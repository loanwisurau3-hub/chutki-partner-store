name: Build Gossaigaon Store APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Manual "Run workflow" button ke liye

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # AGP 9.1.1 & Gradle 9.3.1 ke liye minimum JDK 17 zaroori hai

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure .env exists for Secrets plugin
        run: |
          if [ ! -f .env ]; then
            cat << 'EOF' > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          WEBRTC_TURN_URL=${{ secrets.WEBRTC_TURN_URL }}
          WEBRTC_TURN_USERNAME=${{ secrets.WEBRTC_TURN_USERNAME }}
          WEBRTC_TURN_CREDENTIAL=${{ secrets.WEBRTC_TURN_CREDENTIAL }}
          EOF
          fi

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-store-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
