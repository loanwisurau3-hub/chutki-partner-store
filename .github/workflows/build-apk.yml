name: Build Gossaigaon Store APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate Android project directory
        id: locate
        run: |
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts nahi mili! Repo me ye files hain:"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env exists for Secrets plugin
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          S_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          S_TURN_URL: ${{ secrets.WEBRTC_TURN_URL }}
          S_TURN_USER: ${{ secrets.WEBRTC_TURN_USERNAME }}
          S_TURN_CRED: ${{ secrets.WEBRTC_TURN_CREDENTIAL }}
        run: |
          touch .env
          grep -q "^GEMINI_API_KEY=" .env || printf 'GEMINI_API_KEY=%s\n' "$S_GEMINI" >> .env
          grep -q "^WEBRTC_TURN_URL=" .env || printf 'WEBRTC_TURN_URL=%s\n' "$S_TURN_URL" >> .env
          grep -q "^WEBRTC_TURN_USERNAME=" .env || printf 'WEBRTC_TURN_USERNAME=%s\n' "$S_TURN_USER" >> .env
          grep -q "^WEBRTC_TURN_CREDENTIAL=" .env || printf 'WEBRTC_TURN_CREDENTIAL=%s\n' "$S_TURN_CRED" >> .env

      - name: Ensure debug.keystore exists
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gossaigaon-store-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
